name: Refresh, test and deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ipo-radar-pages
  cancel-in-progress: false

jobs:
  refresh-test-build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Refresh tracked SEC filings
        env:
          SEC_USER_AGENT: 'IPO-Radar/1.0 contact: tyschcnk20@gmail.com'
        run: python scripts/refresh_sec.py
      - name: Validate dataset
        run: python -m unittest discover -s tests -v
      - name: Commit changed snapshot
        if: github.event_name != 'push'
        run: |
          git config user.name "ipo-radar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/ipos.json
          if ! git diff --cached --quiet; then
            git commit -m "data: refresh IPO filing snapshot"
            git push
          fi
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: refresh-test-build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
